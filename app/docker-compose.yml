name: cloudops-store

services:
  db:
    image: postgres:16-alpine
    container_name: cloudops-db
    environment:
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: dbadmin
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: cloudops-api
    environment:
      DATABASE_URL: postgresql://dbadmin:dbadmin@db:5432/appdb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: ./worker
    container_name: cloudops-worker
    environment:
      DATABASE_URL: postgresql://dbadmin:dbadmin@db:5432/appdb
      POLL_INTERVAL: "3"
      PROCESSING_DELAY_MS: "1500"
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cloudops-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata: