apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudops-store-staging
  namespace: argocd
spec:
  description: Proyecto staging - validación pre-prod
  sourceRepos:
    - https://github.com/elbryan123blxd-ai/Proyecto-DevOps
  destinations:
    - namespace: staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
