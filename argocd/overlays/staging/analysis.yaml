apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cloudops-store-canary-staging
  labels:
    app.kubernetes.io/part-of: cloudops-store
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 5
      successCondition: result[0] >= 95
      failureLimit: 3
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring:9090
          query: |
            sum(
              rate(
                nginx_ingress_controller_requests{
                  host="frontend.staging.cloudops.local",
                  status!~"5.."
                }[2m]
              )
            )
            /
            sum(
              rate(
                nginx_ingress_controller_requests{
                  host="frontend.staging.cloudops.local"
                }[2m]
              )
            )
            * 100
            or vector(100)
