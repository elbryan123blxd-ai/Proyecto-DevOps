name: CI - build y tests

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"

permissions:
  contents: read

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Instalar deps API
        working-directory: app/api
        run: pip install -r requirements.txt
      - name: Tests API
        working-directory: app/api
        run: pytest -q
      - name: Lint API (si falla no bloquea)
        working-directory: app/api
        run: python -m py_compile main.py || true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Instalar deps frontend
        working-directory: app/frontend
        run: npm ci || npm install
      - name: Tests frontend
        working-directory: app/frontend
        run: npm test -- --passWithNoTests || echo "sin tests frontend"
      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [api-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API (sin push)
        uses: docker/build-push-action@v6
        with:
          context: ./app/api
          push: false
          tags: api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend (sin push)
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: false
          tags: frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker (sin push)
        uses: docker/build-push-action@v6
        with:
          context: ./app/worker
          push: false
          tags: worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
