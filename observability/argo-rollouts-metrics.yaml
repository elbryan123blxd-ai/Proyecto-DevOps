apiVersion: v1
kind: Service
metadata:
  name: argo-rollouts-metrics
  namespace: argocd
  labels:
    app.kubernetes.io/name: argo-rollouts
spec:
  selector:
    app.kubernetes.io/name: argo-rollouts
  ports:
    - name: metrics
      port: 8090
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argo-rollouts
  namespace: argocd
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts
  namespaceSelector:
    matchNames:
      - argocd
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      # El controller emite `namespace` (dev/staging/prod del rollout); sin esto
      # el relabel del Prometheus operator sobrescribe la label con "argocd".
      honorLabels: true