apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudops-rollout-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: cloudops-store
data:
  rollout-dashboard.json: |-
    {
      "uid": "cloudops-store-rollout-health",
      "title": "CloudOps Store - Rollout Health & Canary",
      "tags": ["cloudops-store", "argo-rollouts"],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "graphTooltip": 1,
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "custom",
            "label": "Entorno",
            "query": "prod, staging, dev",
            "current": { "text": "prod", "value": "prod" },
            "includeAll": false,
            "multi": false,
            "refresh": 1,
            "options": [
              { "text": "prod", "value": "prod" },
              { "text": "staging", "value": "staging" },
              { "text": "dev", "value": "dev" }
            ]
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "Fase actual del rollout (frontend)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds",
                "seriesBy": "last"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              },
              "unitColor": "",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (phase) (rollout_info{name=\"frontend\",namespace=\"$namespace\"})",
              "legendFormat": "{{phase}}",
              "instant": true
            }
          ]
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Health (Deployment api en $namespace)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds", "seriesBy": "last" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0 }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "DEGRADADO", "color": "red" },
                    "1": { "text": "OK", "color": "green" }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (deployment) (kube_deployment_status_replicas_available{namespace=\"$namespace\", deployment=\"api\"})",
              "legendFormat": "{{deployment}}"
            }
          ]
        },
        {
          "type": "stat",
          "id": 3,
          "title": "R├®plicas disponibles (frontend)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds", "seriesBy": "last" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 0.5 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rollout_info_replicas_available{name=\"frontend\",namespace=\"$namespace\"}",
              "legendFormat": "available"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 4,
          "title": "Canary: r├®plicas desired / available / updated",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "auto",
                "spanNulls": true,
                "stacking": { "mode": "none" }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] },
            "tooltip": { "mode": "multi", "sort": "asc" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rollout_info_replicas_updated{name=\"frontend\",namespace=\"$namespace\"}",
              "legendFormat": "updated",
              "instant": false
            },
            {
              "refId": "B",
              "expr": "rollout_info_replicas_available{name=\"frontend\",namespace=\"$namespace\"}",
              "legendFormat": "available"
            },
            {
              "refId": "C",
              "expr": "rollout_info_replicas_desired{name=\"frontend\",namespace=\"$namespace\"}",
              "legendFormat": "desired"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "Success rate del canary (prod) ÔÇö mismo query que AnalysisTemplate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 95 }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20,
                "showPoints": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum by () (rate(nginx_ingress_controller_requests{host=\"frontend.prod.cloudops.local\",status!~\"5..\"}[2m])) / sum by () (rate(nginx_ingress_controller_requests{host=\"frontend.prod.cloudops.local\"}[2m]))) * 100",
              "legendFormat": "success rate",
              "instant": false
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "Errores 5xx frontend (prod)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by () (rate(nginx_ingress_controller_requests{host=\"frontend.prod.cloudops.local\",status=~\"5..\"}[2m]))",
              "legendFormat": "5xx/s",
              "instant": false
            }
          ]
        }
      ]
    }
